name: Security audit

# Replaces the old "Auto-Fix Security Vulnerabilities" workflow, which ran
# daily, failed on every run (its PR-creation step could not open pull
# requests with the default token), and opened a new issue on each failure.
# This workflow only scans and reports; dependency PRs are handled by
# Dependabot (.github/dependabot.yml).

on:
  schedule:
    # Weekly, Monday 02:00 UTC.
    - cron: "0 2 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/requirements.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - backend/requirements.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/security-audit.yml

permissions:
  contents: read

jobs:
  backend-deps:
    name: Backend dependency scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan backend dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-backend.txt

      - name: Publish scan results to summary
        if: always()
        run: |
          if [ -f trivy-backend.txt ]; then
            {
              echo "## Backend dependency scan"
              echo ""
              echo '```'
              cat trivy-backend.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend-deps:
    name: Frontend dependency scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan frontend dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-frontend.txt

      - name: Publish scan results to summary
        if: always()
        run: |
          if [ -f trivy-frontend.txt ]; then
            {
              echo "## Frontend dependency scan"
              echo ""
              echo '```'
              cat trivy-frontend.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
